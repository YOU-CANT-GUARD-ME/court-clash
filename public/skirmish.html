<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLOODSWORN — SKIRMISH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=EB+Garamond:ital,wght@0,500;1,500&family=Pirata+One&family=Noto+Serif+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #070605; --stone: #14110f; --stone2: #221d19; --stone3: #2f2822; --iron: #3d352e;
    --blood: #8e1c1c; --blood-d: #4a0d0d; --ember: #e0503a; --gold: #c9a24a; --gold-d: #7a5a1e;
    --parch: #e6d8b8; --parch2: #d4c299; --ink: #2a1d12; --ink2: #5a4630;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--void); display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; font-family: 'EB Garamond', 'Noto Serif KR', Georgia, serif; }
  canvas { display: block; cursor: none; }
  /* ---- status overlay (menus between rounds) ---- */
  #overlay {
    position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px;
    background: radial-gradient(ellipse at center, rgba(60,14,10,0.55), rgba(4,3,2,0.95) 75%);
    backdrop-filter: blur(4px);
    animation: fadeIn .3s ease-out;
  }
  @keyframes fadeIn { from { opacity: 0; } }
  .card {
    width: min(440px, 100%); background: linear-gradient(170deg, var(--parch), var(--parch2));
    border-radius: 6px; border: 3px solid var(--iron); overflow: hidden;
    box-shadow: 0 0 0 1px #000, 0 0 0 4px var(--stone2), 0 0 0 5px #000, 0 24px 50px #000c;
    animation: rise .4s cubic-bezier(.2,.9,.3,1.1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } }
  .card.still { animation: none; } /* an update to the card already on screen */
  .card-head {
    display: flex; align-items: center; gap: 14px; padding: 18px 22px;
    background: linear-gradient(180deg, var(--stone3), var(--stone)); border-bottom: 3px solid var(--blood);
  }
  .card.win .card-head { border-bottom-color: var(--gold); }
  .card.lose .card-head { border-bottom-color: var(--ember); }
  .card-head h2 {
    font: 900 28px/1 'Cinzel', 'Noto Serif KR', serif; letter-spacing: 2px; color: var(--parch);
    text-shadow: 0 2px 0 #000;
  }
  .card.win h2 { color: var(--gold); }
  .card.lose h2 { color: var(--ember); }
  .card-head small {
    display: block; margin-top: 7px; font: 700 9px 'Cinzel', 'Noto Serif KR', serif; letter-spacing: 2.5px; color: var(--gold);
    text-shadow: none;
  }
  .spinner {
    width: 34px; height: 34px; flex: none; border-radius: 50%;
    border: 3px solid rgba(201,162,74,.15); border-top-color: var(--gold); border-right-color: var(--ember);
    animation: spin .8s cubic-bezier(.5,.1,.5,.9) infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .card-body { padding: 20px 22px 22px; }
  .card-body > p { font-size: 17px; font-style: italic; line-height: 1.4; color: var(--ink2); }
  .card-body > * + * { margin-top: 16px; }
  .tally { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; text-align: center; }
  .tally .side small { display: block; font: 700 9px 'Cinzel', 'Noto Serif KR', serif; letter-spacing: 2px; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tally .side.opp small { color: var(--blood); }
  .tally .side b { display: block; margin: 4px 0 6px; font: 900 44px/1 'Cinzel', 'Noto Serif KR', serif; color: var(--ink); }
  .tally .vs { font: italic 500 24px 'EB Garamond', 'Noto Serif KR', serif; color: #8a7656; }
  .pips { display: flex; justify-content: center; gap: 7px; }
  .pips i { width: 9px; height: 9px; transform: rotate(45deg); background: rgba(90,70,48,.25); }
  .pips i.on { background: var(--gold-d); box-shadow: 0 0 0 2px rgba(201,162,74,.45); }
  .opp .pips i.on { background: var(--blood); box-shadow: 0 0 0 2px rgba(224,80,58,.35); }
  .progress { height: 8px; border: 1px solid var(--ink2); background: rgba(42,29,18,.15); overflow: hidden; }
  .progress i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--blood-d), var(--blood), var(--ember)); transform-origin: left; animation: fill 3s linear both; }
  @keyframes fill { from { transform: scaleX(0); } }
  .progress-label { display: flex; justify-content: space-between; font: 700 9px 'Cinzel', 'Noto Serif KR', serif; letter-spacing: 2px; color: var(--ink2); }
  .keys { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
  .keys div { display: flex; align-items: center; gap: 9px; font-size: 16px; color: var(--ink); }
  kbd {
    min-width: 26px; padding: 4px 7px; border-radius: 3px; text-align: center;
    background: var(--stone3); box-shadow: 0 2px 0 #000; color: var(--gold); font: 700 9px 'Cinzel', 'Noto Serif KR', serif;
  }
  .card-body > p.purse { text-align: center; font: 700 15px 'Cinzel', 'Noto Serif KR', serif; font-style: normal; letter-spacing: 1px; color: var(--gold-d); }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btns.one { grid-template-columns: 1fr; }
  .btn {
    border: 1px solid #000; border-radius: 4px; padding: 14px 10px; cursor: pointer; color: var(--parch);
    font: 900 15px 'Cinzel', 'Noto Serif KR', serif; letter-spacing: 1.5px; text-shadow: 0 1px 0 #000;
    background: linear-gradient(180deg, #4d4339, var(--iron)); box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 3px 0 #000;
    transition: filter .15s, transform .1s;
  }
  .btn:hover { filter: brightness(1.15); transform: translateY(-1px); }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #000; }
  .btn.primary { background: linear-gradient(180deg, #b52828, var(--blood) 60%, #6a1414); box-shadow: inset 0 1px 0 rgba(255,255,255,.15), 0 3px 0 var(--blood-d), 0 0 14px rgba(142,28,28,.4); }
  .btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .sides { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .sides section { padding: 10px 12px; border: 1px solid rgba(90,70,48,.35); border-radius: 4px; background: rgba(255,255,255,.18); }
  .sides h3 { margin-bottom: 6px; font: 900 10px 'Cinzel', 'Noto Serif KR', serif; letter-spacing: 2px; color: var(--gold-d); }
  .sides section.crimson h3 { color: var(--blood); }
  .sides li { list-style: none; padding: 3px 0; font: 700 14px 'Cinzel', 'Noto Serif KR', serif; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sides li.open { font: italic 500 15px 'EB Garamond', 'Noto Serif KR', serif; color: #8a7656; }
  @media (prefers-reduced-motion: reduce) {
    #overlay, .card, .spinner, .progress i { animation: none; }
  }
</style>
</head>

<body>
<canvas id="c"></canvas>
<div id="overlay" role="dialog" aria-live="polite"></div>

<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="mercenary.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
// Render at the screen's pixel density so text and lines stay sharp on
// high-DPI displays. All drawing code works in CSS pixels (W × H).
const DPR = Math.min(window.devicePixelRatio || 1, 2);
let W, H;
function sizeCanvas() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
sizeCanvas();
window.addEventListener('resize', sizeCanvas);
// Canvas text doesn't trigger web-font downloads on its own.
if (document.fonts)
    ['900 12px Cinzel', '700 12px Cinzel', '500 12px "EB Garamond"'].forEach(f => document.fonts.load(f));
const BASE_TILE = 40;
// ── ARENA MAP (wide and mirrored — two spawn corners per band) ─────────────────
// Team 0 spawns on the left, team 1 on the right. The spawn points live in
// server/skirmish.js (SPAWNS) and must stay on open floor if this changes.
const RAW_MAP = [
    "########################################",
    "#......................................#",
    "#......................................#",
    "#.....##........##....##........##.....#",
    "#.....##........##....##........##.....#",
    "#.....##........##....##........##.....#",
    "#.....##........................##.....#",
    "#......................................#",
    "#.................####.................#",
    "#..........###....####....###..........#",
    "#..........###............###..........#",
    "#.###..............................###.#",
    "#.###..............................###.#",
    "#..........###............###..........#",
    "#..........###....####....###..........#",
    "#.................####.................#",
    "#......................................#",
    "#.....##........................##.....#",
    "#.....##........##....##........##.....#",
    "#.....##........##....##........##.....#",
    "#.....##........##....##........##.....#",
    "#......................................#",
    "#......................................#",
    "########################################",
];
const MAP_W = RAW_MAP[0].length, MAP_H = RAW_MAP.length;
// Grow tiles when necessary so the complete arena covers the viewport. The
// network protocol uses tile units, keeping matches aligned across displays.
// Sized for the whole screen, not just the window, so the arena still fills it in fullscreen.
const TILE = Math.max(BASE_TILE, Math.ceil(Math.max(Math.max(W, screen.width) / MAP_W, Math.max(H, screen.height) / MAP_H)));
const WORLD_SCALE = TILE / BASE_TILE;
function isWall(tx, ty) {
    const mx = Math.floor(tx), my = Math.floor(ty);
    if (mx < 0 || mx >= MAP_W || my < 0 || my >= MAP_H)
        return true;
    return RAW_MAP[my][mx] === '#';
}
function isWallPx(px, py) { return isWall(px / TILE, py / TILE); }
// ── PRE-RENDER MAP ────────────────────────────────────────────────────────────
const mapCanvas = document.createElement('canvas');
mapCanvas.width = MAP_W * TILE;
mapCanvas.height = MAP_H * TILE;
const mctx = mapCanvas.getContext('2d');
(function buildMap() {
    paintDungeon(mctx, TILE);
})();
// ── PARTICLES ─────────────────────────────────────────────────────────────────
const particles = [];
function spawnParticles(x, y, color, count, sMin, sMax, life, size = 3) {
    for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2, spd = sMin + Math.random() * (sMax - sMin);
        particles.push({ x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, color, life, maxLife: life, size: size + Math.random() * 2 });
    }
}
// ── BULLETS ───────────────────────────────────────────────────────────────────
// Distance from point (px, py) to the segment a→b. Used for bullet hits so a
// fast bullet can't skip past a target between two frames.
function distToSegment(px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay, len2 = dx * dx + dy * dy;
    const t = len2 ? Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / len2)) : 0;
    return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
}
function makeBullet(x, y, angle, speed = 22 * WORLD_SCALE) {
    return { x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, alive: true, dist: 0 };
}
function updateBullet(b) {
    for (let s = 0; s < 3; s++) {
        const nx = b.x + b.vx / 3, ny = b.y + b.vy / 3;
        if (isWallPx(nx, ny)) {
            b.alive = false;
            spawnParticles(b.x, b.y, '#dcc850', 4, 1, 3, 8, 1);
            return;
        }
        b.x = nx;
        b.y = ny;
    }
    b.dist += Math.hypot(b.vx, b.vy);
    if (b.dist > TILE * 20)
        b.alive = false;
}
// ── ART: dungeon, mercenaries, bolts, torchlight ─────────────────────────────
// Stable per-tile noise, so every stone keeps its own shade, crack or stain.
function tileHash(c, r) {
    let h = (c * 374761393 + r * 668265263) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}
function paintDungeon(g, size) {
    g.fillStyle = '#070605';
    g.fillRect(0, 0, MAP_W * size, MAP_H * size);
    for (let row = 0; row < MAP_H; row++)
        for (let col = 0; col < MAP_W; col++) {
            const x = col * size, y = row * size, h = tileHash(col, row);
            if (RAW_MAP[row][col] === '#') {
                // Heavy stone wall: two courses of offset blocks with a worn top edge.
                const s = 48 + Math.floor(h * 12);
                g.fillStyle = `rgb(${s},${s - 6},${s - 12})`;
                g.fillRect(x, y, size, size);
                g.strokeStyle = 'rgba(0,0,0,0.6)';
                g.lineWidth = 2;
                g.beginPath();
                g.moveTo(x, y + size / 2);
                g.lineTo(x + size, y + size / 2);
                g.moveTo(x + size / 2, y);
                g.lineTo(x + size / 2, y + size / 2);
                g.moveTo(x, y + size / 2);
                g.lineTo(x, y + size);
                g.moveTo(x, y);
                g.lineTo(x + size, y);
                g.stroke();
                g.fillStyle = 'rgba(255,235,200,0.06)';
                g.fillRect(x, y + 1, size, 3);
                g.fillStyle = 'rgba(0,0,0,0.4)';
                g.fillRect(x, y + size - 4, size, 4);
            }
            else {
                // Flagstone floor.
                const s = 33 + Math.floor(h * 9);
                g.fillStyle = `rgb(${s},${s - 4},${s - 9})`;
                g.fillRect(x, y, size, size);
                g.strokeStyle = 'rgba(0,0,0,0.65)';
                g.lineWidth = 2;
                g.beginPath();
                g.moveTo(x, y);
                g.lineTo(x + size, y);
                g.moveTo(x, y);
                g.lineTo(x, y + size);
                g.stroke();
                if (row > 0 && RAW_MAP[row - 1][col] === '#') {
                    const sh = g.createLinearGradient(0, y, 0, y + size * 0.45);
                    sh.addColorStop(0, 'rgba(0,0,0,0.55)');
                    sh.addColorStop(1, 'rgba(0,0,0,0)');
                    g.fillStyle = sh;
                    g.fillRect(x, y, size, size * 0.45);
                }
                if (h > 0.94) {
                    g.strokeStyle = 'rgba(10,8,6,0.8)';
                    g.lineWidth = 1;
                    g.beginPath();
                    g.moveTo(x + size * 0.15, y + size * (0.3 + h * 0.3));
                    g.lineTo(x + size * 0.45, y + size * 0.5);
                    g.lineTo(x + size * 0.6, y + size * 0.35);
                    g.lineTo(x + size * 0.85, y + size * 0.6);
                    g.stroke();
                }
                else if (h < 0.06) {
                    g.fillStyle = 'rgba(100,12,12,0.4)';
                    g.beginPath();
                    g.ellipse(x + size * 0.5, y + size * 0.55, size * 0.3, size * 0.18, h * 40, 0, Math.PI * 2);
                    g.fill();
                }
                else if (h > 0.45 && h < 0.5) {
                    g.fillStyle = 'rgba(160,150,130,0.18)';
                    for (let i = 0; i < 4; i++)
                        g.fillRect(x + size * (0.2 + i * 0.17), y + size * (0.3 + ((i * 7) % 5) * 0.1), 2, 2);
                }
            }
        }
}
// A bolt or arrow pointing along its velocity.
function drawBolt(b, camX, camY, shaft, head, glow, len = 14) {
    const sp = Math.hypot(b.vx, b.vy) || 1, ux = b.vx / sp, uy = b.vy / sp;
    const x = b.x - camX, y = b.y - camY, tx = x - ux * len, ty = y - uy * len;
    ctx.save();
    ctx.lineCap = 'round';
    if (glow) {
        ctx.globalAlpha = 0.35;
        ctx.strokeStyle = glow;
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(tx, ty);
        ctx.lineTo(x, y);
        ctx.stroke();
        ctx.globalAlpha = 1;
    }
    ctx.strokeStyle = shaft;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(x, y);
    ctx.stroke();
    ctx.fillStyle = head;
    ctx.beginPath();
    ctx.moveTo(x + ux * 5, y + uy * 5);
    ctx.lineTo(x - uy * 3, y + ux * 3);
    ctx.lineTo(x + uy * 3, y - ux * 3);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = shaft;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(tx - ux * 3 - uy * 3, ty - uy * 3 + ux * 3);
    ctx.moveTo(tx, ty);
    ctx.lineTo(tx - ux * 3 + uy * 3, ty - uy * 3 - ux * 3);
    ctx.stroke();
    ctx.restore();
}
// Darkness everywhere except a flickering pool of torchlight around (px, py).
function drawTorchlight(px, py) {
    const t = Date.now();
    const f = 1 + Math.sin(t * 0.011) * 0.025 + Math.sin(t * 0.029) * 0.015;
    const g = ctx.createRadialGradient(px, py, 70 * f, px, py, Math.max(W, H) * 0.8 * f);
    g.addColorStop(0, 'rgba(6,4,3,0)');
    g.addColorStop(0.35, 'rgba(6,4,3,0.3)');
    g.addColorStop(1, 'rgba(4,3,2,0.72)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const warm = ctx.createRadialGradient(px, py, 0, px, py, 190 * f);
    warm.addColorStop(0, 'rgba(255,140,60,0.10)');
    warm.addColorStop(1, 'rgba(255,140,60,0)');
    ctx.fillStyle = warm;
    ctx.fillRect(px - 200, py - 200, 400, 400);
    ctx.restore();
}
// ── PLAYER (local, fully simulated) ───────────────────────────────────────────
function makePlayer(spawn) {
    return { x: spawn.x, y: spawn.y, angle: 0, speed: 4 * WORLD_SCALE, health: 100, displayHealth: 100, ammo: 30,
        hurtTimer: 0, shootTimer: 0, reloadTimer: 0, reloadCd: 4, rollTimer: 0,
        bullets: [], bob: 0, moving: false };
}
function updatePlayer(player, keys, mouseX, mouseY, camX, camY) {
    const M = 10 * WORLD_SCALE;
    let spd = player.speed;
    if (player.rollTimer > 0) {
        spd *= 2.4;
        player.rollTimer--;
    }
    let moved = false;
    if (keys['w'] || keys['arrowup']) {
        const ny = player.y - spd;
        if (!isWallPx(player.x, ny - M))
            player.y = ny;
        moved = true;
    }
    if (keys['s'] || keys['arrowdown']) {
        const ny = player.y + spd;
        if (!isWallPx(player.x, ny + M))
            player.y = ny;
        moved = true;
    }
    if (keys['a'] || keys['arrowleft']) {
        const nx = player.x - spd;
        if (!isWallPx(nx - M, player.y))
            player.x = nx;
        moved = true;
    }
    if (keys['d'] || keys['arrowright']) {
        const nx = player.x + spd;
        if (!isWallPx(nx + M, player.y))
            player.x = nx;
        moved = true;
    }
    player.moving = moved;
    player.bob = moved ? (player.bob + 0.15) % (Math.PI * 2) : player.bob * 0.85;
    if (player.hurtTimer > 0)
        player.hurtTimer--;
    if (player.shootTimer > 0)
        player.shootTimer--;
    if (player.reloadTimer > 0)
        player.reloadTimer--;
    player.angle = Math.atan2((camY + mouseY) - player.y, (camX + mouseX) - player.x);
    for (let i = player.bullets.length - 1; i >= 0; i--) {
        const b = player.bullets[i], ox = b.x, oy = b.y;
        updateBullet(b);
        if (!b.alive) {
            player.bullets.splice(i, 1);
            continue;
        }
        // Hit test against foes' last known positions; bolts pass through allies.
        const target = fighters.findIndex((f, j) => j !== me && isFoe(j) && f.health > 0 && !f.left
            && distToSegment(f.x, f.y, ox, oy, b.x, b.y) < 16 * WORLD_SCALE);
        if (target >= 0) {
            b.alive = false;
            player.bullets.splice(i, 1);
            spawnParticles(fighters[target].x, fighters[target].y, '#8c0a0a', 10, 1.5, 4, 20, 2);
            sendMsg({ type: 'skHit', target, damage: 20 });
        }
    }
}
function playerShoot(player) {
    if (player.ammo <= 0 || player.reloadTimer > 0 || matchState !== 'playing' || player.health <= 0)
        return;
    player.ammo--;
    player.shootTimer = 8;
    player.reloadTimer = player.reloadCd;
    player.bullets.push(makeBullet(player.x, player.y, player.angle));
    spawnParticles(player.x + Math.cos(player.angle) * 18, player.y + Math.sin(player.angle) * 18, '#ffa020', 5, 1, 4, 10, 2);
    sendMsg({ type: 'skShoot', x: player.x / TILE, y: player.y / TILE, angle: player.angle });
}
function drawFighter(p, camX, camY, pal, label) {
    const sx = p.x - camX, sy = p.y - camY, r = 12 * WORLD_SCALE;
    ctx.save();
    if (p.health <= 0) {
        // Fallen: a dim body under a dark stain, no weapon glow, greyed name.
        ctx.globalAlpha = 0.5;
        ctx.fillStyle = 'rgba(90,10,10,0.55)';
        ctx.beginPath();
        ctx.ellipse(sx, sy + 3, r * 1.6, r * 0.9, 0.3, 0, Math.PI * 2);
        ctx.fill();
        drawMercenary(sx, sy, r, p.angle, p.look);
        ctx.globalAlpha = 1;
        ctx.strokeStyle = 'rgba(10,8,7,0.9)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(sx - 7, sy - 7); ctx.lineTo(sx + 7, sy + 7);
        ctx.moveTo(sx + 7, sy - 7); ctx.lineTo(sx - 7, sy + 7);
        ctx.stroke();
        drawText(label, sx, sy - r - 14, { size: 10, align: 'center', color: '#7a6e60', spacing: 1, shadow: 'rgba(0,0,0,0.85)', shadowOffset: 1 });
        ctx.restore();
        return;

    const glow = ctx.createRadialGradient(sx, sy, r * 0.5, sx, sy, r * 2.6);

    drawText(':', W / 2, sy + 65, { size: 24, family: 'num', align: 'center', color: UI.muted });
    drawText(String(theirs), W / 2 + 24, sy + 68, { size: 28, family: 'num', align: 'center', color: UI.oppRed });
    const allies = [me, ...fighters.map((_, i) => i).filter(i => i !== me && !isFoe(i))];
    const foes = fighters.map((_, i) => i).filter(isFoe);
    const column = (ids, x, w, title, col, alignRight) => {
        drawText(title, alignRight ? x + w : x, sy + 20, { size: 9, color: col, spacing: 2, align: alignRight ? 'right' : 'left' });
        for (let k = 0; k < WINS_NEEDED; k++) {
            ctx.beginPath();
            const won = alignRight ? theirs : mine;
            ctx.arc(alignRight ? x + w - textWidth(title, 9, 'ui', 2) - 12 - k * 11 : x + textWidth(title, 9, 'ui', 2) + 12 + k * 11, sy + 17, 3.5, 0, Math.PI * 2);
            ctx.fillStyle = k < won ? col : 'rgba(154,139,116,0.2)';
            ctx.fill();
        }
        ids.forEach((i, row) => {
            const f = fighters[i], y = sy + 30 + row * 31;
            const out = f.left ? tr('sk.fled') : f.health <= 0 ? tr('sk.down') : String(Math.ceil(f.health));
            const [hA, hB] = healthColors(f.health);
            const nameCol = f.health > 0 ? (i === me ? UI.gold : UI.paper) : UI.muted;
            drawText(nameOf(i), alignRight ? x + w : x, y + 12, { size: 12, family: 'display', color: nameCol, align: alignRight ? 'right' : 'left', spacing: 0.5 });
            drawText(out, alignRight ? x : x + w, y + 12, { size: 12, family: 'num', color: f.health > 0 ? hA : UI.muted, align: alignRight ? 'left' : 'right' });
            meter(x, y + 17, w, 8, f.displayHealth / 100, hA, hB, alignRight);
        });
    };
    column(allies, sx + 16, side - 32, tr('sk.yourBand'), UI.gold, false);
    column(foes, sx + side + mid + 16, side - 32, tr('sk.foes'), UI.oppRed, true);
}
function drawAmmo() {
    const aw = 214, ah = 86, ax = W / 2 - aw / 2, ay = H - ah - 16;
    panel(ax, ay, aw, ah, { accent: player.ammo ? UI.orange : UI.red });
    drawText(tr('hud.bolts'), ax + 16, ay + 27, { size: 9, color: UI.muted, spacing: 2 });
    const ammoCol = player.ammo === 0 ? UI.red : player.ammo <= 5 ? '#ffc24a' : UI.paper;
    drawText(String(player.ammo), ax + 16, ay + 68, { size: 32, family: 'num', color: ammoCol });
    const pipX = ax + aw - 16 - 100;
    for (let i = 0; i < 30; i++) {
        ctx.fillStyle = i < player.ammo ? (player.ammo <= 5 ? '#ffc24a' : UI.gold) : 'rgba(154,139,116,0.15)';
        roundRect(pipX + (i % 10) * 10, ay + 20 + Math.floor(i / 10) * 10, 7, 6, 2);
        ctx.fill();
    }
    if (player.ammo === 0) {
        const kw = keycap('R', pipX, ay + 52);
        drawText(tr('hud.reload'), pipX + kw + 8, ay + 66, { size: 11, color: UI.red, spacing: 1, alpha: 0.6 + Math.abs(Math.sin(Date.now() * 0.008)) * 0.4 });
    }
}
// Shown instead of the bolt panel while we sit out the round.
function drawDownBanner() {
    const ally = spectating();
    const text = ally ? tr('sk.spectate', { name: ally.name.toUpperCase() }) : tr('sk.downAlone');
    const w = Math.min(W - 32, textWidth(text, 13, 'ui', 2) + 48), h = 46, x = W / 2 - w / 2, y = H - h - 24;
    panel(x, y, w, h, { accent: UI.red });
    drawText(text, W / 2, y + 28, { size: 13, align: 'center', color: UI.paper, spacing: 2 });
}
// Arrows on the screen edge pointing at anyone standing out of view.
function drawMarkers(camX, camY) {
    fighters.forEach((f, i) => {
        if (i === me || f.health <= 0)
            return;
        const ox = f.x - camX, oy = f.y - camY, m = 40;
        if (ox > -10 && ox < W + 10 && oy > -10 && oy < H + 10)
            return;
        const foe = isFoe(i);
        const ang = Math.atan2(oy - H / 2, ox - W / 2);
        const ex = Math.max(m, Math.min(W - m, ox)), ey = Math.max(130 + m / 2, Math.min(H - m, oy));
        ctx.save();
        ctx.translate(ex, ey);
        ctx.beginPath();
        ctx.arc(0, 0, 18, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(10,8,7,0.85)';
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = foe ? UI.red : UI.gold;
        ctx.stroke();
        ctx.rotate(ang);
        ctx.beginPath();
        ctx.moveTo(12, 0);
        ctx.lineTo(1, -7);
        ctx.lineTo(1, 7);
        ctx.closePath();
        ctx.fillStyle = foe ? UI.oppRed : UI.gold;
        ctx.fill();
        ctx.restore();
    });
}
// Knock-downs, top right, fading after a few seconds.
function drawFeed() {
    const now = performance.now();
    let y = 128;
    for (const item of feed) {
        const age = (now - item.at) / 1000;
        if (age > 6)
            continue;
        const a = age > 5 ? 6 - age : 1;
        const w = textWidth(item.text, 10, 'ui', 1) + 24;
        ctx.save();
        ctx.globalAlpha = a;
        panel(W - 16 - w, y, w, 26, { r: 13, shadow: false });
        drawText(item.text, W - 16 - w / 2, y + 17, { size: 10, align: 'center', spacing: 1 });
        ctx.restore();
        y += 32;
    }
}
// "ROUND 2" then "FIGHT!" at the start of each round.
function drawRoundBanner() {
    const t = (performance.now() - roundBannerStart) / 1000;
    if (t < 0 || t > 1.8)
        return;
    const fight = t > 0.9;
    const local = fight ? (t - 0.9) / 0.9 : t / 0.9;
    const alpha = local < 0.15 ? local / 0.15 : local > 0.75 ? Math.max(0, (1 - local) / 0.25) : 1;
    const scale = fight ? 1 + (1 - Math.min(1, local * 4)) * 0.4 : 1;
    const bh = 120, by = H / 2 - bh / 2;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgba(10,8,7,0.85)';
    ctx.fillRect(0, by, W, bh);
    ctx.fillStyle = fight ? UI.gold : UI.orange;
    ctx.fillRect(0, by, W, 4);
    ctx.fillRect(0, by + bh - 4, W, 4);
    ctx.translate(W / 2, H / 2);
    ctx.scale(scale, scale);
    if (fight)
        drawText(tr('duel.fight'), 0, 4, { size: 64, family: 'display', align: 'center', baseline: 'middle', color: UI.red, shadow: '#000', shadowOffset: 4, spacing: 4 });
    else {
        drawText(tr('duel.round', { n: round }), 0, -2, { size: 48, family: 'display', align: 'center', baseline: 'middle', shadow: UI.orangeD, shadowOffset: 3, spacing: 1 });
        const mine = scores[myTeam()], theirs = scores[1 - myTeam()];
        const sub = tr(mine === WINS_NEEDED - 1 && theirs === WINS_NEEDED - 1 ? 'duel.deciding' : mine === WINS_NEEDED - 1 ? 'duel.matchPoint' : 'duel.bestOf3');
        drawText(sub, 0, 40, { size: 11, align: 'center', color: UI.gold, spacing: 4 });
    }
    ctx.restore();
}
function drawControls(cx, y) {
    const items = controls().map(([k, label]) => ({ k, label, w: Math.max(22, textWidth(k, 10) + 12) + 6 + textWidth(label, 11) }));
    const total = items.reduce((s, i) => s + i.w, 0) + (items.length - 1) * 18 + 32;
    panel(cx - total / 2, y - 8, total, 36, { r: 18, shadow: false });
    let x = cx - total / 2 + 16;
    for (const i of items) {
        const kw = keycap(i.k, x, y);
        drawText(i.label, x + kw + 6, y + 14, { size: 11, color: UI.muted });
        x += i.w + 18;
    }
}
function drawCrosshair() {
    const empty = player.ammo <= 0;
    const gap = 7 + (player.shootTimer / 8) * 5, len = 9;
    const col = empty ? UI.red : UI.gold;
    ctx.save();
    ctx.lineCap = 'round';
    for (const [lw, c] of [[4, 'rgba(10,8,7,0.85)'], [2, col]]) {
        ctx.lineWidth = lw;
        ctx.strokeStyle = c;
        ctx.beginPath();
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
            ctx.moveTo(mouseX + dx * gap, mouseY + dy * gap);
            ctx.lineTo(mouseX + dx * (gap + len), mouseY + dy * (gap + len));
        }
        ctx.stroke();
    }
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(mouseX, mouseY, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}
document.addEventListener('keydown', e => {
    if (e.code === 'KeyR')
        player.ammo = 30; // local-only reload for now
});
// ── FULLSCREEN ────────────────────────────────────────────────────────────────
// Browsers only allow fullscreen from a click or key press, so the first one on
// this page enters it. F toggles it after that.
function isFullscreen() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function enterFullscreen() {
    const el = document.documentElement, req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!req || isFullscreen())
        return;
    try {
        const p = req.call(el);
        if (p && p.catch)
            p.catch(() => { });
    }
    catch { }
}
function exitFullscreen() {
    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    if (exit && isFullscreen())
        exit.call(document);
}
let autoFullscreenDone = false;
function onFirstGesture(e) {
    if (autoFullscreenDone || (e.type === 'keydown' && e.code === 'KeyF'))
        return;
    autoFullscreenDone = true;
    enterFullscreen();
}
document.addEventListener('mousedown', onFirstGesture);
document.addEventListener('keydown', onFirstGesture);
document.addEventListener('keydown', e => {
    if (e.code === 'KeyF' && !e.repeat) {
        autoFullscreenDone = true;
        isFullscreen() ? exitFullscreen() : enterFullscreen();
    }
});
// ── GAME LOOP ─────────────────────────────────────────────────────────────────
// Gold for us and our ally, crimson for the foe.
const ME_COLOR = { cloak: '#3a2a1e', cloakDark: '#0e0a07', trim: '#c9a24a', helm: '#9aa0a8', label: '#e6d8b8' };
const ALLY_COLOR = { cloak: '#2e2a1e', cloakDark: '#0c0a07', trim: '#d8b860', helm: '#a8aeb6', label: '#f0d890' };
const OPP_COLOR = { cloak: '#3a1414', cloakDark: '#0e0505', trim: '#e0503a', helm: '#6a6e74', label: '#ff9a88' };
function clampCam(worldSize, viewSize, focus) {
    if (worldSize <= viewSize)
        return (worldSize - viewSize) / 2; // center the map in the extra space
    return Math.max(0, Math.min(worldSize - viewSize, focus - viewSize / 2));
}
function lerpAngle(a, b, t) {
    let diff = ((b - a + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
    return a + diff * t;
}
function loop(ts) {
    requestAnimationFrame(loop);
    const focus = spectating() || player;
    let camX = clampCam(MAP_W * TILE, W, focus.x);
    let camY = clampCam(MAP_H * TILE, H, focus.y);
    const live = matchState === 'playing' || matchState === 'roundover';
    canvas.style.cursor = matchState === 'playing' && player.health > 0 ? 'none' : 'default';
    if (matchState === 'playing' && player.health > 0) {
        updatePlayer(player, keys, mouseX, mouseY, camX, camY);
        if (mouseDown)
            playerShoot(player);
        // Send our state a few times a second, not every frame.
        if (ts - lastStateSend > 50) {
            lastStateSend = ts;
            sendMsg({ type: 'skState', x: player.x / TILE, y: player.y / TILE, angle: player.angle, moving: player.moving });
        }
    }
    if (live) {
        fighters.forEach((f, i) => {
            if (i === me)
                return;
            if (f.shootTimer > 0)
                f.shootTimer--;
            // Glide toward the last relayed position; hides the gap between updates.
            if (f.health > 0) {
                f.x += (f.targetX - f.x) * 0.25;
                f.y += (f.targetY - f.y) * 0.25;
                f.angle = lerpAngle(f.angle, f.targetAngle, 0.3);
            }
            for (let k = f.bullets.length - 1; k >= 0; k--) {
                updateBullet(f.bullets[k]);
                if (!f.bullets[k].alive)
                    f.bullets.splice(k, 1);
            }
        });
        if (player.health <= 0 && player.hurtTimer > 0)
            player.hurtTimer--; // updatePlayer (which fades it) doesn't run while we're down
        if (player.health <= 0)
            for (let k = player.bullets.length - 1; k >= 0; k--) {
                updateBullet(player.bullets[k]);
                if (!player.bullets[k].alive)
                    player.bullets.splice(k, 1);
            }
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vx *= 0.92;
            p.vy *= 0.92;
            p.life--;
            if (p.life <= 0)
                particles.splice(i, 1);
        }
        const now = spectating() || player;
        camX = clampCam(MAP_W * TILE, W, now.x);
        camY = clampCam(MAP_H * TILE, H, now.y);
    }
    ctx.drawImage(mapCanvas, -camX, -camY);
    const vignette = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.75);
    vignette.addColorStop(0, 'rgba(0,0,0,0)');
    vignette.addColorStop(1, 'rgba(0,0,0,0.35)');
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, W, H);
    for (const p of particles) {
        const alpha = p.life / p.maxLife;
        ctx.globalAlpha = alpha * 0.85;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x - camX, p.y - camY, Math.max(0.5, p.size * alpha), 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (live && fighters.length) {
        const pal = i => (i === me ? ME_COLOR : isFoe(i) ? OPP_COLOR : ALLY_COLOR);
        // The fallen underneath, then the standing, then us on top.
        const order = fighters.map((_, i) => i).filter(i => !fighters[i].left)
            .sort((a, b) => (fighters[a].health > 0) - (fighters[b].health > 0) || (a === me) - (b === me));
        for (const i of order)
            drawFighter(fighters[i], camX, camY, pal(i), nameOf(i));
        fighters.forEach((f, i) => drawBolts(f, camX, camY, pal(i)));
        const lit = spectating() || player;
        drawTorchlight(lit.x - camX, lit.y - camY);
        drawHUD(camX, camY);
    }
}
// Arriving from the lobby's TO BATTLE with a warband: start searching straight away.
if (location.hash === '#party') {
    history.replaceState(null, '', location.pathname);
    findSkirmish();
}
else {
    showIntro();
    openSocket();
}
requestAnimationFrame(loop);
</script>
