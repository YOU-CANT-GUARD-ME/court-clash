<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COURT CLASH — 1V1 SHOWDOWN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Rubik:wght@500;700&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0e1a34; --navy2: #1c3260; --navy3: #0a1226;
    --orange: #e8622c; --orange-d: #b8451a; --gold: #f4b93c; --gold-d: #c98f18;
    --paper: #fff3d8; --red: #ff5a3c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--navy3); display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; font-family: 'Rubik', Arial, sans-serif; }
  canvas { display: block; cursor: none; }
  /* ---- status overlay (menus between rounds) ---- */
  #overlay {
    position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px;
    background: radial-gradient(ellipse at center, rgba(28,50,96,0.7), rgba(10,18,38,0.94) 75%);
    backdrop-filter: blur(4px);
    animation: fadeIn .3s ease-out;
  }
  @keyframes fadeIn { from { opacity: 0; } }
  .card {
    width: min(440px, 100%); background: var(--paper); border-radius: 18px; overflow: hidden;
    box-shadow: 0 10px 0 var(--navy2), 0 18px 34px #0008;
    animation: rise .4s cubic-bezier(.2,.9,.3,1.2) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.98); } }
  .card-head {
    display: flex; align-items: center; gap: 14px; padding: 18px 22px;
    background: linear-gradient(180deg, var(--navy2), var(--navy)); border-bottom: 4px solid var(--orange);
  }
  .card.win .card-head { border-bottom-color: var(--gold); }
  .card.lose .card-head { border-bottom-color: var(--red); }
  .card-head h2 {
    font: italic 34px/1 'Anton', sans-serif; letter-spacing: .5px; color: var(--paper);
    text-shadow: 2px 2px 0 var(--orange-d);
  }
  .card.win h2 { color: var(--gold); text-shadow: 2px 2px 0 #7a4a08; }
  .card.lose h2 { color: var(--red); text-shadow: 2px 2px 0 #5a0e08; }
  .card-head small {
    display: block; margin-top: 7px; font: normal 700 10px 'Oswald', sans-serif; letter-spacing: 3px; color: var(--gold);
    text-shadow: none;
  }
  .spinner {
    width: 34px; height: 34px; flex: none; border-radius: 50%;
    border: 4px solid rgba(244,185,60,.15); border-top-color: var(--gold); border-right-color: var(--orange);
    animation: spin .7s cubic-bezier(.5,.1,.5,.9) infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .card-body { padding: 20px 22px 22px; }
  .card-body > p { font-size: 13px; font-weight: 500; line-height: 1.5; color: #6b5a3c; }
  .card-body > * + * { margin-top: 16px; }
  .tally { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; text-align: center; }
  .tally .side small { display: block; font-size: 9px; font-weight: 700; letter-spacing: 2px; color: var(--orange-d); }
  .tally .side.opp small { color: #a0242a; }
  .tally .side b { display: block; margin: 2px 0 4px; font: 700 46px/1 'Oswald', sans-serif; color: var(--navy3); }
  .tally .vs { font: 22px 'Anton', sans-serif; color: #c9a877; }
  .pips { display: flex; justify-content: center; gap: 5px; }
  .pips i { width: 10px; height: 10px; border-radius: 50%; background: #e2c898; }
  .pips i.on { background: var(--orange); box-shadow: 0 0 0 2px #f8c9a8; }
  .opp .pips i.on { background: #c8281e; box-shadow: 0 0 0 2px #f2b0a8; }
  .progress { height: 8px; border-radius: 4px; background: #e2c898; overflow: hidden; }
  .progress i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--gold), var(--orange)); transform-origin: left; animation: fill 3s linear both; }
  @keyframes fill { from { transform: scaleX(0); } }
  .progress-label { display: flex; justify-content: space-between; font-size: 9px; font-weight: 700; letter-spacing: 2px; color: #9c8459; }
  .keys { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
  .keys div { display: flex; align-items: center; gap: 9px; font-size: 12px; font-weight: 700; color: var(--navy3); }
  kbd {
    min-width: 26px; padding: 4px 7px; border-radius: 5px; text-align: center;
    background: var(--navy2); box-shadow: 0 2px 0 var(--navy3); color: var(--gold); font: 700 10px 'Rubik', sans-serif;
  }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btns.one { grid-template-columns: 1fr; }
  .btn {
    border: 0; border-radius: 10px; padding: 14px 10px; cursor: pointer; color: #fff;
    font: 18px 'Anton', sans-serif; letter-spacing: 1px;
    background: var(--navy2); box-shadow: 0 4px 0 var(--navy3); transition: background .15s, transform .1s;
  }
  .btn:hover { background: #27427a; transform: translateY(-2px); }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--navy3); }
  .btn.primary { background: var(--orange); box-shadow: 0 4px 0 #7c2e10; }
  .btn.primary:hover { background: #ff7a40; }
  .btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    #overlay, .card, .spinner, .progress i { animation: none; }
  }
</style>
</head>

<body>
<canvas id="c"></canvas>
<div id="overlay" role="dialog" aria-live="polite"></div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
// Render at the screen's pixel density so text and lines stay sharp on
// high-DPI displays. All drawing code works in CSS pixels (W × H).
const DPR = Math.min(window.devicePixelRatio || 1, 2);
let W, H;
function sizeCanvas() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
sizeCanvas();
window.addEventListener('resize', sizeCanvas);
// Canvas text doesn't trigger web-font downloads on its own.
if (document.fonts)
    ['12px Anton', '700 12px Rubik', '700 12px Oswald'].forEach(f => document.fonts.load(f));
const BASE_TILE = 40;
// ── ARENA MAP (compact, symmetric — built for 1v1, not survival) ─────────────
const RAW_MAP = [
    "##################################",
    "#................................#",
    "#................................#",
    "#................................#",
    "#...###........####........###...#",
    "#...###........####........###...#",
    "#...###........####........###...#",
    "#................................#",
    "#..............####..............#",
    "#..............#..#..............#",
    "#..............#..#..............#",
    "#..............####..............#",
    "#................................#",
    "#...###........####........###...#",
    "#...###........####........###...#",
    "#...###........####........###...#",
    "#................................#",
    "#................................#",
    "#................................#",
    "##################################",
];
const MAP_W = RAW_MAP[0].length, MAP_H = RAW_MAP.length;
// Grow tiles when necessary so the complete arena covers the viewport. The
// network protocol uses tile units, keeping matches aligned across displays.
const TILE = Math.max(BASE_TILE, Math.ceil(Math.max(W / MAP_W, H / MAP_H)));
const WORLD_SCALE = TILE / BASE_TILE;
function isWall(tx, ty) {
    const mx = Math.floor(tx), my = Math.floor(ty);
    if (mx < 0 || mx >= MAP_W || my < 0 || my >= MAP_H)
        return true;
    return RAW_MAP[my][mx] === '#';
}
function isWallPx(px, py) { return isWall(px / TILE, py / TILE); }
// ── PRE-RENDER MAP ────────────────────────────────────────────────────────────
const mapCanvas = document.createElement('canvas');
mapCanvas.width = MAP_W * TILE;
mapCanvas.height = MAP_H * TILE;
const mctx = mapCanvas.getContext('2d');
(function buildMap() {
    mctx.fillStyle = '#0a1226';
    mctx.fillRect(0, 0, mapCanvas.width, mapCanvas.height);
    for (let row = 0; row < MAP_H; row++)
        for (let col = 0; col < MAP_W; col++) {
            const x = col * TILE, y = row * TILE;
            if (RAW_MAP[row][col] === '#') {
                mctx.fillStyle = '#1c3260';
                mctx.fillRect(x, y, TILE, TILE);
                if ((row + col) % 2 === 0) {
                    mctx.fillStyle = '#14213d';
                    mctx.fillRect(x + 4, y + 4, TILE - 8, TILE - 8);
                }
                mctx.strokeStyle = '#0a1226';
                mctx.lineWidth = 2;
                mctx.beginPath();
                mctx.moveTo(x, y);
                mctx.lineTo(x + TILE, y);
                mctx.stroke();
                mctx.beginPath();
                mctx.moveTo(x, y);
                mctx.lineTo(x, y + TILE);
                mctx.stroke();
            }
            else {
                mctx.fillStyle = (row + col) % 2 === 0 ? '#c9803f' : '#a8642c';
                mctx.fillRect(x, y, TILE, TILE);
                mctx.strokeStyle = '#8a5a2e';
                mctx.lineWidth = 1;
                mctx.beginPath();
                mctx.moveTo(x, y);
                mctx.lineTo(x + TILE, y);
                mctx.stroke();
                mctx.beginPath();
                mctx.moveTo(x, y);
                mctx.lineTo(x, y + TILE);
                mctx.stroke();
            }
        }
})();
// ── PARTICLES ─────────────────────────────────────────────────────────────────
const particles = [];
function spawnParticles(x, y, color, count, sMin, sMax, life, size = 3) {
    for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2, spd = sMin + Math.random() * (sMax - sMin);
        particles.push({ x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, color, life, maxLife: life, size: size + Math.random() * 2 });
    }
}
// ── BULLETS ───────────────────────────────────────────────────────────────────
// Distance from point (px, py) to the segment a→b. Used for bullet hits so a
// fast bullet can't skip past a target between two frames.
function distToSegment(px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay, len2 = dx * dx + dy * dy;
    const t = len2 ? Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / len2)) : 0;
    return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
}
function makeBullet(x, y, angle, speed = 22 * WORLD_SCALE) {
    return { x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, alive: true, dist: 0 };
}
function updateBullet(b) {
    for (let s = 0; s < 3; s++) {
        const nx = b.x + b.vx / 3, ny = b.y + b.vy / 3;
        if (isWallPx(nx, ny)) {
            b.alive = false;
            spawnParticles(b.x, b.y, '#dcc850', 4, 1, 3, 8, 1);
            return;
        }
        b.x = nx;
        b.y = ny;
    }
    b.dist += Math.hypot(b.vx, b.vy);
    if (b.dist > TILE * 20)
        b.alive = false;
}
// ── PLAYER (local, fully simulated) ───────────────────────────────────────────
function makePlayer(spawn) {
    return { x: spawn.x, y: spawn.y, angle: 0, speed: 4 * WORLD_SCALE, health: 100, displayHealth: 100, ammo: 30,
        hurtTimer: 0, shootTimer: 0, reloadTimer: 0, reloadCd: 4, rollTimer: 0,
        bullets: [], bob: 0, moving: false };
}
function updatePlayer(player, keys, mouseX, mouseY, camX, camY) {
    const M = 10 * WORLD_SCALE;
    let spd = player.speed;
    if (player.rollTimer > 0) {
        spd *= 2.4;
        player.rollTimer--;
    }
    let moved = false;
    if (keys['w'] || keys['arrowup']) {
        const ny = player.y - spd;
        if (!isWallPx(player.x, ny - M))
            player.y = ny;
        moved = true;
    }
    if (keys['s'] || keys['arrowdown']) {
        const ny = player.y + spd;
        if (!isWallPx(player.x, ny + M))
            player.y = ny;
        moved = true;
    }
    if (keys['a'] || keys['arrowleft']) {
        const nx = player.x - spd;
        if (!isWallPx(nx - M, player.y))
            player.x = nx;
        moved = true;
    }
    if (keys['d'] || keys['arrowright']) {
        const nx = player.x + spd;
        if (!isWallPx(nx + M, player.y))
            player.x = nx;
        moved = true;
    }
    player.moving = moved;
    player.bob = moved ? (player.bob + 0.15) % (Math.PI * 2) : player.bob * 0.85;
    if (player.hurtTimer > 0)
        player.hurtTimer--;
    if (player.shootTimer > 0)
        player.shootTimer--;
    if (player.reloadTimer > 0)
        player.reloadTimer--;
    player.angle = Math.atan2((camY + mouseY) - player.y, (camX + mouseX) - player.x);
    for (let i = player.bullets.length - 1; i >= 0; i--) {
        const b = player.bullets[i], ox = b.x, oy = b.y;
        updateBullet(b);
        if (!b.alive) {
            player.bullets.splice(i, 1);
            continue;
        }
        // Hit test against the last known opponent position relayed from the server.
        if (distToSegment(opponent.x, opponent.y, ox, oy, b.x, b.y) < 16 * WORLD_SCALE) {
            b.alive = false;
            player.bullets.splice(i, 1);
            spawnParticles(opponent.x, opponent.y, '#8c0a0a', 10, 1.5, 4, 20, 2);
            sendMsg({ type: 'iHit', damage: 20 });
        }
    }
}
function playerShoot(player) {
    if (player.ammo <= 0 || player.reloadTimer > 0 || matchState !== 'playing')
        return;
    player.ammo--;
    player.shootTimer = 8;
    player.reloadTimer = player.reloadCd;
    player.bullets.push(makeBullet(player.x, player.y, player.angle));
    spawnParticles(player.x + Math.cos(player.angle) * 18, player.y + Math.sin(player.angle) * 18, '#ffa020', 5, 1, 4, 10, 2);
    sendMsg({ type: 'shoot', x: player.x / TILE, y: player.y / TILE, angle: player.angle });
}
function drawFighter(p, camX, camY, color, label, number) {
    const sx = p.x - camX, sy = p.y - camY, r = 12 * WORLD_SCALE;
    ctx.save();
    const glow = ctx.createRadialGradient(sx, sy, r * 0.5, sx, sy, r * 2.6);
    glow.addColorStop(0, color.mid + '33');
    glow.addColorStop(1, color.mid + '00');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(sx, sy, r * 2.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.ellipse(sx, sy + 12, 14, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = color.dark;
    ctx.beginPath();
    ctx.arc(sx, sy, r + 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = color.mid;
    ctx.beginPath();
    ctx.arc(sx, sy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = color.light;
    ctx.beginPath();
    ctx.arc(sx, sy, r - 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff3d8';
    setFont(11, 'display');
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(number, sx, sy + 1);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    const hx = sx + Math.cos(p.angle) * 3, hy = sy + Math.sin(p.angle) * 3;
    ctx.fillStyle = '#b49164';
    ctx.beginPath();
    ctx.arc(hx, hy - 2, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#3c3723';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(hx, hy - 2, 5, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = '#f4b93c';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(hx, hy - 2, 5.2, -Math.PI * 0.85, -Math.PI * 0.15);
    ctx.stroke();
    const bhx = sx + Math.cos(p.angle) * (r + 6), bhy = sy + Math.sin(p.angle) * (r + 6);
    ctx.fillStyle = '#e8622c';
    ctx.beginPath();
    ctx.arc(bhx, bhy, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#3c1e0f';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(bhx, bhy, 5, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(bhx - 5, bhy);
    ctx.lineTo(bhx + 5, bhy);
    ctx.moveTo(bhx, bhy - 5);
    ctx.lineTo(bhx, bhy + 5);
    ctx.stroke();
    if (p.shootTimer > 4) {
        const fx = sx + Math.cos(p.angle) * (r + 12), fy = sy + Math.sin(p.angle) * (r + 12);
        const g = ctx.createRadialGradient(fx, fy, 0, fx, fy, 10);
        g.addColorStop(0, 'rgba(255,255,180,0.9)');
        g.addColorStop(1, 'rgba(255,180,0,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(fx, fy, 10, 0, Math.PI * 2);
        ctx.fill();
    }
    drawText(label, sx, sy - r - 14, { size: 10, align: 'center', color: color.label, spacing: 1,
        shadow: 'rgba(10,18,38,0.8)', shadowOffset: 1 });
    for (const b of p.bullets) {
        ctx.fillStyle = '#ffe650';
        ctx.beginPath();
        ctx.arc(b.x - camX, b.y - camY, 3, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.restore();
}
// ── NETWORKING ────────────────────────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════════════════
// EDIT THIS when you deploy: put your Render server's URL here (no protocol,
// no trailing slash) — e.g. "mercenary-showdown-server.onrender.com".
// While it's still the placeholder below, the game auto-falls-back to
// localhost:8080 so local testing keeps working without any edits.
// ═══════════════════════════════════════════════════════════════════════════
const DEPLOYED_SERVER_HOST = "court-clash.onrender.com";
const WS_URL = (() => {
    const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    const protocol = location.protocol === 'https:' ? 'wss://' : 'ws://';
    if (isLocal)
        return `ws://localhost:8080`;
    if (DEPLOYED_SERVER_HOST === "PUT-YOUR-RENDER-SERVER-URL-HERE") {
        console.error('Set DEPLOYED_SERVER_HOST in showdown.html before deploying.');
    }
    return `${protocol}${DEPLOYED_SERVER_HOST}`;
})();
let socket = null;
let myPlayerNum = null;
let matchState = 'idle'; // idle | queued | playing | roundover | matchover
let scores = [0, 0];
let round = 1;
function sendMsg(msg) {
    if (socket && socket.readyState === WebSocket.OPEN)
        socket.send(JSON.stringify(msg));
}
function connect() {
    if (socket)
        disconnect();
    const ws = socket = new WebSocket(WS_URL);
    matchState = 'queued';
    showSearching();
    // Events from a socket we've since replaced or cancelled are ignored.
    ws.addEventListener('open', () => {
        if (ws === socket)
            sendMsg({ type: 'findMatch' });
    });
    ws.addEventListener('message', (ev) => {
        if (ws === socket)
            handleServerMessage(JSON.parse(ev.data));
    });
    ws.addEventListener('close', () => {
        // 'idle' means the error handler already explained the problem.
        if (ws === socket && matchState !== 'matchover' && matchState !== 'idle')
            showConnectionProblem('CONNECTION LOST', 'The match server disconnected.');
    });
    ws.addEventListener('error', () => {
        if (ws === socket)
            showConnectionProblem('CONNECTION FAILED', 'Could not reach the match server. It may be waking up, so try again in a few seconds.');
    });
}
function disconnect() {
    const ws = socket;
    socket = null;
    if (ws)
        ws.close();
}
function handleServerMessage(msg) {
    switch (msg.type) {
        case 'queued':
            showSearching();
            break;
        case 'matchFound':
            myPlayerNum = msg.playerNum;
            break;
        case 'roundStart':
            round = msg.round;
            scores = msg.scores;
            player = makePlayer({ x: msg.yourSpawn.x * TILE, y: msg.yourSpawn.y * TILE });
            opponent = makePlayer({ x: msg.oppSpawn.x * TILE, y: msg.oppSpawn.y * TILE });
            opponent.targetX = opponent.x;
            opponent.targetY = opponent.y;
            opponent.targetAngle = opponent.angle;
            matchState = 'playing';
            roundBannerStart = performance.now();
            hideOverlay();
            break;
        case 'opponentState':
            // Don't snap straight to the new position — set it as an interpolation
            // target and glide there over the next few frames (see the loop()).
            opponent.targetX = msg.x * TILE;
            opponent.targetY = msg.y * TILE;
            opponent.targetAngle = msg.angle;
            opponent.moving = msg.moving;
            break;
        case 'opponentShoot':
            opponent.bullets.push(makeBullet(msg.x * TILE, msg.y * TILE, msg.angle));
            spawnParticles(msg.x * TILE + Math.cos(msg.angle) * 18, msg.y * TILE + Math.sin(msg.angle) * 18, '#ffa020', 5, 1, 4, 10, 2);
            break;
        case 'healthUpdate':
            player.health = msg.health[myPlayerNum];
            opponent.health = msg.health[1 - myPlayerNum];
            if (player.health < prevMyHealth)
                player.hurtTimer = 30;
            prevMyHealth = player.health;
            break;
        case 'roundOver':
            scores = msg.scores;
            matchState = 'roundover';
            showRoundOver(msg.youWon);
            break;
        case 'matchOver':
            scores = msg.scores;
            matchState = 'matchover';
            showMatchOver(msg.youWon ? 'VICTORY' : 'DEFEAT', 'FINAL SCORE', msg.youWon ? 'win' : 'lose');
            break;
        case 'opponentDisconnected':
            matchState = 'matchover';
            showMatchOver('OPPONENT LEFT', 'YOU WIN BY FORFEIT', 'win');
            break;
    }
}
// ── OVERLAY / STATUS UI ────────────────────────────────────────────────────────
const WINS_NEEDED = 2; // best of 3, must match the server
const overlay = document.getElementById('overlay');
function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls)
        n.className = cls;
    if (text != null)
        n.textContent = text;
    return n;
}
// Builds a lobby-style card: navy header (title + tag), then body content.
function showCard({ title, tag, tone, spinner, body = [], buttons = [] }) {
    const card = el('div', 'card' + (tone ? ' ' + tone : ''));
    const head = el('div', 'card-head');
    if (spinner)
        head.append(el('div', 'spinner'));

// ── INPUT ─────────────────────────────────────────────────────────────────────
const keys = {};
let mouseX = W / 2, mouseY = H / 2, mouseDown = false;

}

document.addEventListener('keyup', e => {

// ── GAME STATE ────────────────────────────────────────────────────────────────
let player = makePlayer({ x: 2.5 * TILE, y: 2.5 * TILE });

const UI = { navy: '#0e1a34', navy2: '#1c3260', navy3: '#0a1226', orange: '#e8622c', orangeD: '#b8451a',

function setFont(size, family = 'ui', weight) {

// ── HUD ───────────────────────────────────────────────────────────────────────
function drawHUD(camX, camY) {

// TV-style scoreboard: your health | round + score | opponent's health

function drawAmmo() {

// Arrow on the screen edge pointing at the opponent when they're out of view.
function drawOpponentMarker(camX, camY) {

// "ROUND 2" then "FIGHT!" at the start of each round.

document.addEventListener('keydown', e => {

// ── GAME LOOP ─────────────────────────────────────────────────────────────────
const ME_COLOR = { dark: '#7a2e0f', mid: '#e8622c', light: '#b8451a', label: '#ffd9b8' };

function loop(ts) {

showIntro();
