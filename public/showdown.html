<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLOODSWORN — THE DUEL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=EB+Garamond:ital,wght@0,500;1,500&family=Pirata+One&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #070605; --stone: #14110f; --stone2: #221d19; --stone3: #2f2822; --iron: #3d352e;
    --blood: #8e1c1c; --blood-d: #4a0d0d; --ember: #e0503a; --gold: #c9a24a; --gold-d: #7a5a1e;
    --parch: #e6d8b8; --parch2: #d4c299; --ink: #2a1d12; --ink2: #5a4630;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--void); display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; font-family: 'EB Garamond', Georgia, serif; }
  canvas { display: block; cursor: none; }
  /* ---- status overlay (menus between rounds) ---- */
  #overlay {
    position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px;
    background: radial-gradient(ellipse at center, rgba(60,14,10,0.55), rgba(4,3,2,0.95) 75%);
    backdrop-filter: blur(4px);
    animation: fadeIn .3s ease-out;
  }
  @keyframes fadeIn { from { opacity: 0; } }
  .card {
    width: min(440px, 100%); background: linear-gradient(170deg, var(--parch), var(--parch2));
    border-radius: 6px; border: 3px solid var(--iron); overflow: hidden;
    box-shadow: 0 0 0 1px #000, 0 0 0 4px var(--stone2), 0 0 0 5px #000, 0 24px 50px #000c;
    animation: rise .4s cubic-bezier(.2,.9,.3,1.1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } }
  .card-head {
    display: flex; align-items: center; gap: 14px; padding: 18px 22px;
    background: linear-gradient(180deg, var(--stone3), var(--stone)); border-bottom: 3px solid var(--blood);
  }
  .card.win .card-head { border-bottom-color: var(--gold); }
  .card.lose .card-head { border-bottom-color: var(--ember); }
  .card-head h2 {
    font: 900 28px/1 'Cinzel', serif; letter-spacing: 2px; color: var(--parch);
    text-shadow: 0 2px 0 #000;
  }
  .card.win h2 { color: var(--gold); }
  .card.lose h2 { color: var(--ember); }
  .card-head small {
    display: block; margin-top: 7px; font: 700 9px 'Cinzel', serif; letter-spacing: 2.5px; color: var(--gold);
    text-shadow: none;
  }
  .spinner {
    width: 34px; height: 34px; flex: none; border-radius: 50%;
    border: 3px solid rgba(201,162,74,.15); border-top-color: var(--gold); border-right-color: var(--ember);
    animation: spin .8s cubic-bezier(.5,.1,.5,.9) infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .card-body { padding: 20px 22px 22px; }
  .card-body > p { font-size: 17px; font-style: italic; line-height: 1.4; color: var(--ink2); }
  .card-body > * + * { margin-top: 16px; }
  .tally { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; text-align: center; }
  .tally .side small { display: block; font: 700 9px 'Cinzel', serif; letter-spacing: 2px; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tally .side.opp small { color: var(--blood); }
  .tally .side b { display: block; margin: 4px 0 6px; font: 900 44px/1 'Cinzel', serif; color: var(--ink); }
  .tally .vs { font: italic 500 24px 'EB Garamond', serif; color: #8a7656; }
  .pips { display: flex; justify-content: center; gap: 7px; }
  .pips i { width: 9px; height: 9px; transform: rotate(45deg); background: rgba(90,70,48,.25); }
  .pips i.on { background: var(--gold-d); box-shadow: 0 0 0 2px rgba(201,162,74,.45); }
  .opp .pips i.on { background: var(--blood); box-shadow: 0 0 0 2px rgba(224,80,58,.35); }
  .progress { height: 8px; border: 1px solid var(--ink2); background: rgba(42,29,18,.15); overflow: hidden; }
  .progress i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--blood-d), var(--blood), var(--ember)); transform-origin: left; animation: fill 3s linear both; }
  @keyframes fill { from { transform: scaleX(0); } }
  .progress-label { display: flex; justify-content: space-between; font: 700 9px 'Cinzel', serif; letter-spacing: 2px; color: var(--ink2); }
  .keys { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
  .keys div { display: flex; align-items: center; gap: 9px; font-size: 16px; color: var(--ink); }
  kbd {
    min-width: 26px; padding: 4px 7px; border-radius: 3px; text-align: center;
    background: var(--stone3); box-shadow: 0 2px 0 #000; color: var(--gold); font: 700 9px 'Cinzel', serif;
  }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btns.one { grid-template-columns: 1fr; }
  .btn {
    border: 1px solid #000; border-radius: 4px; padding: 14px 10px; cursor: pointer; color: var(--parch);
    font: 900 15px 'Cinzel', serif; letter-spacing: 1.5px; text-shadow: 0 1px 0 #000;
    background: linear-gradient(180deg, #4d4339, var(--iron)); box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 3px 0 #000;
    transition: filter .15s, transform .1s;
  }
  .btn:hover { filter: brightness(1.15); transform: translateY(-1px); }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #000; }
  .btn.primary { background: linear-gradient(180deg, #b52828, var(--blood) 60%, #6a1414); box-shadow: inset 0 1px 0 rgba(255,255,255,.15), 0 3px 0 var(--blood-d), 0 0 14px rgba(142,28,28,.4); }
  .btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    #overlay, .card, .spinner, .progress i { animation: none; }
  }
</style>
</head>

<body>
<canvas id="c"></canvas>
<div id="overlay" role="dialog" aria-live="polite"></div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
// Render at the screen's pixel density so text and lines stay sharp on
// high-DPI displays. All drawing code works in CSS pixels (W × H).
const DPR = Math.min(window.devicePixelRatio || 1, 2);
let W, H;
function sizeCanvas() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
sizeCanvas();
window.addEventListener('resize', sizeCanvas);
// Canvas text doesn't trigger web-font downloads on its own.
if (document.fonts)
    ['900 12px Cinzel', '700 12px Cinzel', '500 12px "EB Garamond"'].forEach(f => document.fonts.load(f));
const BASE_TILE = 40;
// ── ARENA MAP (compact, symmetric — built for 1v1, not survival) ─────────────
const RAW_MAP = [
    "##################################",
    "#................................#",
    "#................................#",
    "#................................#",
    "#...###........####........###...#",
    "#...###........####........###...#",
    "#...###........####........###...#",
    "#................................#",
    "#..............####..............#",
    "#..............#..#..............#",
    "#..............#..#..............#",
    "#..............####..............#",
    "#................................#",
    "#...###........####........###...#",
    "#...###........####........###...#",
    "#...###........####........###...#",
    "#................................#",
    "#................................#",
    "#................................#",
    "##################################",
];
const MAP_W = RAW_MAP[0].length, MAP_H = RAW_MAP.length;
// Grow tiles when necessary so the complete arena covers the viewport. The
// network protocol uses tile units, keeping matches aligned across displays.
const TILE = Math.max(BASE_TILE, Math.ceil(Math.max(W / MAP_W, H / MAP_H)));
const WORLD_SCALE = TILE / BASE_TILE;
function isWall(tx, ty) {
    const mx = Math.floor(tx), my = Math.floor(ty);
    if (mx < 0 || mx >= MAP_W || my < 0 || my >= MAP_H)
        return true;
    return RAW_MAP[my][mx] === '#';
}
function isWallPx(px, py) { return isWall(px / TILE, py / TILE); }
// ── PRE-RENDER MAP ────────────────────────────────────────────────────────────
const mapCanvas = document.createElement('canvas');
mapCanvas.width = MAP_W * TILE;
mapCanvas.height = MAP_H * TILE;
const mctx = mapCanvas.getContext('2d');
(function buildMap() {
    paintDungeon(mctx, TILE);
})();
// ── PARTICLES ─────────────────────────────────────────────────────────────────
const particles = [];
function spawnParticles(x, y, color, count, sMin, sMax, life, size = 3) {
    for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2, spd = sMin + Math.random() * (sMax - sMin);
        particles.push({ x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, color, life, maxLife: life, size: size + Math.random() * 2 });
    }
}
// ── BULLETS ───────────────────────────────────────────────────────────────────
// Distance from point (px, py) to the segment a→b. Used for bullet hits so a
// fast bullet can't skip past a target between two frames.
function distToSegment(px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay, len2 = dx * dx + dy * dy;
    const t = len2 ? Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / len2)) : 0;
    return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
}
function makeBullet(x, y, angle, speed = 22 * WORLD_SCALE) {
    return { x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, alive: true, dist: 0 };
}
function updateBullet(b) {
    for (let s = 0; s < 3; s++) {
        const nx = b.x + b.vx / 3, ny = b.y + b.vy / 3;
        if (isWallPx(nx, ny)) {
            b.alive = false;
            spawnParticles(b.x, b.y, '#dcc850', 4, 1, 3, 8, 1);
            return;
        }
        b.x = nx;
        b.y = ny;
    }
    b.dist += Math.hypot(b.vx, b.vy);
    if (b.dist > TILE * 20)

// ── ART: dungeon, mercenaries, bolts, torchlight ─────────────────────────────
// Stable per-tile noise, so every stone keeps its own shade, crack or stain.
function tileHash(c, r) {
    let h = (c * 374761393 + r * 668265263) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}
function paintDungeon(g, size) {
    g.fillStyle = '#070605';
    g.fillRect(0, 0, MAP_W * size, MAP_H * size);
    for (let row = 0; row < MAP_H; row++)
        for (let col = 0; col < MAP_W; col++) {
            const x = col * size, y = row * size, h = tileHash(col, row);
            if (RAW_MAP[row][col] === '#') {
                // Heavy stone wall: two courses of offset blocks with a worn top edge.
                const s = 48 + Math.floor(h * 12);
                g.fillStyle = `rgb(${s},${s - 6},${s - 12})`;
                g.fillRect(x, y, size, size);
                g.strokeStyle = 'rgba(0,0,0,0.6)';
                g.lineWidth = 2;
                g.beginPath();
                g.moveTo(x, y + size / 2);
                g.lineTo(x + size, y + size / 2);
                g.moveTo(x + size / 2, y);
                g.lineTo(x + size / 2, y + size / 2);
                g.moveTo(x, y + size / 2);
                g.lineTo(x, y + size);
                g.moveTo(x, y);
                g.lineTo(x + size, y);
                g.stroke();
                g.fillStyle = 'rgba(255,235,200,0.06)';
                g.fillRect(x, y + 1, size, 3);
                g.fillStyle = 'rgba(0,0,0,0.4)';
                g.fillRect(x, y + size - 4, size, 4);
            }
            else {
                // Flagstone floor.
                const s = 33 + Math.floor(h * 9);
                g.fillStyle = `rgb(${s},${s - 4},${s - 9})`;
                g.fillRect(x, y, size, size);
                g.strokeStyle = 'rgba(0,0,0,0.65)';
                g.lineWidth = 2;
                g.beginPath();
                g.moveTo(x, y);
                g.lineTo(x + size, y);
                g.moveTo(x, y);
                g.lineTo(x, y + size);
                g.stroke();
                if (row > 0 && RAW_MAP[row - 1][col] === '#') {
                    const sh = g.createLinearGradient(0, y, 0, y + size * 0.45);
                    sh.addColorStop(0, 'rgba(0,0,0,0.55)');
                    sh.addColorStop(1, 'rgba(0,0,0,0)');
                    g.fillStyle = sh;
                    g.fillRect(x, y, size, size * 0.45);
                }
                if (h > 0.94) {
                    g.strokeStyle = 'rgba(10,8,6,0.8)';
                    g.lineWidth = 1;
                    g.beginPath();
                    g.moveTo(x + size * 0.15, y + size * (0.3 + h * 0.3));
                    g.lineTo(x + size * 0.45, y + size * 0.5);
                    g.lineTo(x + size * 0.6, y + size * 0.35);
                    g.lineTo(x + size * 0.85, y + size * 0.6);
                    g.stroke();
                }
                else if (h < 0.06) {
                    g.fillStyle = 'rgba(100,12,12,0.4)';
                    g.beginPath();
                    g.ellipse(x + size * 0.5, y + size * 0.55, size * 0.3, size * 0.18, h * 40, 0, Math.PI * 2);
                    g.fill();
                }
                else if (h > 0.45 && h < 0.5) {
                    g.fillStyle = 'rgba(160,150,130,0.18)';
                    for (let i = 0; i < 4; i++)
                        g.fillRect(x + size * (0.2 + i * 0.17), y + size * (0.3 + ((i * 7) % 5) * 0.1), 2, 2);
                }
            }
        }
}
const MERC_SELF = { cloak: '#3a2a1e', cloakDark: '#0e0a07', trim: '#c9a24a', helm: '#9aa0a8' };
// A hooded mercenary seen from above, crossbow aimed along `angle`.
function drawMercenary(sx, sy, r, angle, pal) {
    const ca = Math.cos(angle), sa = Math.sin(angle);
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.beginPath();
    ctx.ellipse(sx, sy + r, r * 1.2, r * 0.42, 0, 0, Math.PI * 2);
    ctx.fill();
    // Crossbow: stock, steel limbs, string.
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#2a1a0e';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(sx + ca * (r + 13), sy + sa * (r + 13));
    ctx.stroke();
    ctx.strokeStyle = '#6a4a2a';
    ctx.lineWidth = 3;
    ctx.stroke();
    const lx = sx + ca * (r + 5), ly = sy + sa * (r + 5), span = 1.05, lr = 10;
    ctx.strokeStyle = '#b8bec6';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(lx, ly, lr, angle - span, angle + span);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(230,216,184,0.8)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(lx + Math.cos(angle - span) * lr, ly + Math.sin(angle - span) * lr);
    ctx.lineTo(sx + ca * (r + 1), sy + sa * (r + 1));
    ctx.lineTo(lx + Math.cos(angle + span) * lr, ly + Math.sin(angle + span) * lr);
    ctx.stroke();
    // Cloak with a trimmed hem.
    ctx.fillStyle = pal.cloakDark;
    ctx.beginPath();
    ctx.arc(sx, sy, r + 2, 0, Math.PI * 2);
    ctx.fill();
    const cg = ctx.createRadialGradient(sx - ca * 3, sy - sa * 3, 2, sx, sy, r);
    cg.addColorStop(0, pal.cloak);
    cg.addColorStop(1, pal.cloakDark);
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.arc(sx, sy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = pal.trim;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(sx, sy, r - 1, 0, Math.PI * 2);
    ctx.stroke();
    // Pauldrons either side.
    ctx.fillStyle = pal.helm;
    for (const side of [-1, 1]) {
        ctx.beginPath();
        ctx.arc(sx - sa * side * (r - 3), sy + ca * side * (r - 3), 3.5, 0, Math.PI * 2);
        ctx.fill();
    }
    // Helm with a visor slit facing the aim.
    const hx = sx + ca * 2, hy = sy + sa * 2, hr = r * 0.5;
    const hg = ctx.createRadialGradient(hx - 2, hy - 2, 1, hx, hy, hr);
    hg.addColorStop(0, '#e0e4ea');
    hg.addColorStop(1, pal.helm);
    ctx.fillStyle = hg;
    ctx.beginPath();
    ctx.arc(hx, hy, hr, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#0a0807';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(hx + ca * hr * 0.4 - sa * hr * 0.6, hy + sa * hr * 0.4 + ca * hr * 0.6);
    ctx.lineTo(hx + ca * hr * 0.4 + sa * hr * 0.6, hy + sa * hr * 0.4 - ca * hr * 0.6);
    ctx.stroke();
    ctx.restore();
}
// A bolt or arrow pointing along its velocity.
function drawBolt(b, camX, camY, shaft, head, glow, len = 14) {
    const sp = Math.hypot(b.vx, b.vy) || 1, ux = b.vx / sp, uy = b.vy / sp;
    const x = b.x - camX, y = b.y - camY, tx = x - ux * len, ty = y - uy * len;
    ctx.save();
    ctx.lineCap = 'round';
    if (glow) {
        ctx.globalAlpha = 0.35;
        ctx.strokeStyle = glow;
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(tx, ty);
        ctx.lineTo(x, y);
        ctx.stroke();
        ctx.globalAlpha = 1;
    }
    ctx.strokeStyle = shaft;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(x, y);
    ctx.stroke();
    ctx.fillStyle = head;
    ctx.beginPath();
    ctx.moveTo(x + ux * 5, y + uy * 5);
    ctx.lineTo(x - uy * 3, y + ux * 3);
    ctx.lineTo(x + uy * 3, y - ux * 3);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = shaft;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(tx - ux * 3 - uy * 3, ty - uy * 3 + ux * 3);
    ctx.moveTo(tx, ty);
    ctx.lineTo(tx - ux * 3 + uy * 3, ty - uy * 3 - ux * 3);
    ctx.stroke();
    ctx.restore();
}
// Darkness everywhere except a flickering pool of torchlight around (px, py).
function drawTorchlight(px, py) {
    const t = Date.now();
    const f = 1 + Math.sin(t * 0.011) * 0.025 + Math.sin(t * 0.029) * 0.015;
    const g = ctx.createRadialGradient(px, py, 70 * f, px, py, Math.max(W, H) * 0.8 * f);
    g.addColorStop(0, 'rgba(6,4,3,0)');
    g.addColorStop(0.35, 'rgba(6,4,3,0.3)');
    g.addColorStop(1, 'rgba(4,3,2,0.72)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const warm = ctx.createRadialGradient(px, py, 0, px, py, 190 * f);
    warm.addColorStop(0, 'rgba(255,140,60,0.10)');
    warm.addColorStop(1, 'rgba(255,140,60,0)');
    ctx.fillStyle = warm;
    ctx.fillRect(px - 200, py - 200, 400, 400);
    ctx.restore();
}
// ── PLAYER (local, fully simulated) ───────────────────────────────────────────
function makePlayer(spawn) {
    return { x: spawn.x, y: spawn.y, angle: 0, speed: 4 * WORLD_SCALE, health: 100, displayHealth: 100, ammo: 30,
        hurtTimer: 0, shootTimer: 0, reloadTimer: 0, reloadCd: 4, rollTimer: 0,
        bullets: [], bob: 0, moving: false };
}
function updatePlayer(player, keys, mouseX, mouseY, camX, camY) {
    const M = 10 * WORLD_SCALE;
    let spd = player.speed;
    if (player.rollTimer > 0) {
        spd *= 2.4;
        player.rollTimer--;
    }
    let moved = false;
    if (keys['w'] || keys['arrowup']) {
        const ny = player.y - spd;
        if (!isWallPx(player.x, ny - M))
            player.y = ny;
        moved = true;
    }
    if (keys['s'] || keys['arrowdown']) {
        const ny = player.y + spd;
        if (!isWallPx(player.x, ny + M))
            player.y = ny;
        moved = true;
    }
    if (keys['a'] || keys['arrowleft']) {
        const nx = player.x - spd;
        if (!isWallPx(nx - M, player.y))
            player.x = nx;
        moved = true;
    }
    if (keys['d'] || keys['arrowright']) {
        const nx = player.x + spd;
        if (!isWallPx(nx + M, player.y))
            player.x = nx;
        moved = true;
    }
    player.moving = moved;
    player.bob = moved ? (player.bob + 0.15) % (Math.PI * 2) : player.bob * 0.85;
    if (player.hurtTimer > 0)
        player.hurtTimer--;
    if (player.shootTimer > 0)
        player.shootTimer--;
    if (player.reloadTimer > 0)
        player.reloadTimer--;
    player.angle = Math.atan2((camY + mouseY) - player.y, (camX + mouseX) - player.x);
    for (let i = player.bullets.length - 1; i >= 0; i--) {
        const b = player.bullets[i], ox = b.x, oy = b.y;
        updateBullet(b);
        if (!b.alive) {
            player.bullets.splice(i, 1);
            continue;
        }
        // Hit test against the last known opponent position relayed from the server.
        if (distToSegment(opponent.x, opponent.y, ox, oy, b.x, b.y) < 16 * WORLD_SCALE) {
            b.alive = false;
            player.bullets.splice(i, 1);
            spawnParticles(opponent.x, opponent.y, '#8c0a0a', 10, 1.5, 4, 20, 2);

    }
}
function playerShoot(player) {
    if (player.ammo <= 0 || player.reloadTimer > 0 || matchState !== 'playing')
        return;
    player.ammo--;
    player.shootTimer = 8;

    drawText('BOLTS', ax + 16, ay + 27, { size: 9, color: UI.muted, spacing: 2 });
    const ammoCol = player.ammo === 0 ? UI.red : player.ammo <= 5 ? '#ffc24a' : UI.paper;
    drawText(String(player.ammo), ax + 16, ay + 68, { size: 32, family: 'num', color: ammoCol });
    const pipX = ax + aw - 16 - 100;
    for (let i = 0; i < 30; i++) {
        ctx.fillStyle = i < player.ammo ? (player.ammo <= 5 ? '#ffc24a' : UI.gold) : 'rgba(154,139,116,0.15)';
        roundRect(pipX + (i % 10) * 10, ay + 20 + Math.floor(i / 10) * 10, 7, 6, 2);
        ctx.fill();
    }
    if (player.ammo === 0) {
        const kw = keycap('R', pipX, ay + 52);
        drawText('RELOAD', pipX + kw + 8, ay + 66, { size: 11, color: UI.red, spacing: 1, alpha: 0.6 + Math.abs(Math.sin(Date.now() * 0.008)) * 0.4 });
    }
}
// Arrow on the screen edge pointing at the opponent when they're out of view.
function drawOpponentMarker(camX, camY) {
    const ox = opponent.x - camX, oy = opponent.y - camY, m = 40;
    if (ox > -10 && ox < W + 10 && oy > -10 && oy < H + 10)
        return;
    const ang = Math.atan2(oy - H / 2, ox - W / 2);
    // Clamp to the screen edge, staying clear of the scoreboard and ammo panel.
    const ex = Math.max(m, Math.min(W - m, ox)), ey = Math.max(110 + m / 2, Math.min(H - m, oy));
    ctx.save();
    ctx.translate(ex, ey);
    ctx.beginPath();
    ctx.arc(0, 0, 18, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(10,8,7,0.85)';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = UI.red;
    ctx.stroke();
    ctx.rotate(ang);
    ctx.beginPath();
    ctx.moveTo(12, 0);
    ctx.lineTo(1, -7);
    ctx.lineTo(1, 7);
    ctx.closePath();
    ctx.fillStyle = UI.oppRed;
    ctx.fill();
    ctx.restore();
}
// "ROUND 2" then "FIGHT!" at the start of each round.
function drawRoundBanner() {
    const t = (performance.now() - roundBannerStart) / 1000;
    if (t < 0 || t > 1.8)
        return;
    const fight = t > 0.9;
    const local = fight ? (t - 0.9) / 0.9 : t / 0.9;
    const alpha = local < 0.15 ? local / 0.15 : local > 0.75 ? Math.max(0, (1 - local) / 0.25) : 1;
    const scale = fight ? 1 + (1 - Math.min(1, local * 4)) * 0.4 : 1;
    const bh = 120, by = H / 2 - bh / 2;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgba(10,8,7,0.85)';
    ctx.fillRect(0, by, W, bh);
    ctx.fillStyle = fight ? UI.gold : UI.orange;
    ctx.fillRect(0, by, W, 4);
    ctx.fillRect(0, by + bh - 4, W, 4);
    ctx.translate(W / 2, H / 2);
    ctx.scale(scale, scale);
    if (fight)
        drawText('FIGHT!', 0, 4, { size: 64, family: 'display', align: 'center', baseline: 'middle', color: UI.red, shadow: '#000', shadowOffset: 4, spacing: 4 });
    else {
        drawText(`ROUND ${round}`, 0, -2, { size: 48, family: 'display', align: 'center', baseline: 'middle', shadow: UI.orangeD, shadowOffset: 3, spacing: 1 });
        const mine = myPlayerNum !== null ? scores[myPlayerNum] : 0;
        const theirs = myPlayerNum !== null ? scores[1 - myPlayerNum] : 0;
        const sub = mine === WINS_NEEDED - 1 && theirs === WINS_NEEDED - 1 ? 'DECIDING ROUND' : mine === WINS_NEEDED - 1 ? 'MATCH POINT' : 'BEST OF THREE';
        drawText(sub, 0, 40, { size: 11, align: 'center', color: UI.gold, spacing: 4 });
    }
    ctx.restore();
}
function drawControls(cx, y) {
    const items = CONTROLS.map(([k, label]) => ({ k, label, w: Math.max(22, textWidth(k, 10) + 12) + 6 + textWidth(label, 11) }));
    const total = items.reduce((s, i) => s + i.w, 0) + (items.length - 1) * 18 + 32;
    panel(cx - total / 2, y - 8, total, 36, { r: 18, shadow: false });
    let x = cx - total / 2 + 16;
    for (const i of items) {
        const kw = keycap(i.k, x, y);
        drawText(i.label, x + kw + 6, y + 14, { size: 11, color: UI.muted });
        x += i.w + 18;
    }
}
function drawCrosshair() {
    const empty = player.ammo <= 0;
    const gap = 7 + (player.shootTimer / 8) * 5, len = 9;
    const col = empty ? UI.red : UI.gold;
    ctx.save();
    ctx.lineCap = 'round';
    for (const [lw, c] of [[4, 'rgba(10,8,7,0.85)'], [2, col]]) {
        ctx.lineWidth = lw;
        ctx.strokeStyle = c;
        ctx.beginPath();
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
            ctx.moveTo(mouseX + dx * gap, mouseY + dy * gap);
            ctx.lineTo(mouseX + dx * (gap + len), mouseY + dy * (gap + len));
        }
        ctx.stroke();
    }
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(mouseX, mouseY, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}
document.addEventListener('keydown', e => {
    if (e.key === 'r' || e.key === 'R')
        player.ammo = 30; // local-only reload for now
});
// ── GAME LOOP ─────────────────────────────────────────────────────────────────
const ME_COLOR = { cloak: '#3a2a1e', cloakDark: '#0e0a07', trim: '#c9a24a', helm: '#9aa0a8', label: '#e6d8b8' };
const OPP_COLOR = { cloak: '#3a1414', cloakDark: '#0e0505', trim: '#e0503a', helm: '#6a6e74', label: '#ff9a88' };
function clampCam(worldSize, viewSize, focus) {
    if (worldSize <= viewSize)
        return (worldSize - viewSize) / 2; // center the map in the extra space
    return Math.max(0, Math.min(worldSize - viewSize, focus - viewSize / 2));
}
function lerpAngle(a, b, t) {
    let diff = ((b - a + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
    return a + diff * t;
}
function loop(ts) {
    requestAnimationFrame(loop);
    let camX = clampCam(MAP_W * TILE, W, player.x);
    let camY = clampCam(MAP_H * TILE, H, player.y);
    if (matchState === 'playing') {
        canvas.style.cursor = 'none';
        updatePlayer(player, keys, mouseX, mouseY, camX, camY);
        if (mouseDown)
            playerShoot(player);
        for (let i = opponent.bullets.length - 1; i >= 0; i--) {
            updateBullet(opponent.bullets[i]);
            if (!opponent.bullets[i].alive)
                opponent.bullets.splice(i, 1);
        }
        // Glide toward the opponent's last known position/angle rather than
        // snapping — hides the gap between network updates.
        if (opponent.targetX !== undefined) {
            opponent.x += (opponent.targetX - opponent.x) * 0.25;
            opponent.y += (opponent.targetY - opponent.y) * 0.25;
            opponent.angle = lerpAngle(opponent.angle, opponent.targetAngle, 0.3);
        }
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vx *= 0.92;
            p.vy *= 0.92;
            p.life--;
            if (p.life <= 0)
                particles.splice(i, 1);
        }
        // Send our state a few times a second, not every frame.
        if (ts - lastStateSend > 50) {
            lastStateSend = ts;
            sendMsg({ type: 'state', x: player.x / TILE, y: player.y / TILE, angle: player.angle, moving: player.moving });
        }
        camX = clampCam(MAP_W * TILE, W, player.x);
        camY = clampCam(MAP_H * TILE, H, player.y);
    }
    else {
        canvas.style.cursor = 'default';
    }
    ctx.drawImage(mapCanvas, -camX, -camY);
    const vignette = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.75);
    vignette.addColorStop(0, 'rgba(0,0,0,0)');
    vignette.addColorStop(1, 'rgba(0,0,0,0.35)');
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, W, H);
    for (const p of particles) {
        const alpha = p.life / p.maxLife;
        ctx.globalAlpha = alpha * 0.85;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x - camX, p.y - camY, Math.max(0.5, p.size * alpha), 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (matchState === 'playing' || matchState === 'roundover') {
        drawFighter(opponent, camX, camY, OPP_COLOR, oppLabel());
        drawFighter(player, camX, camY, ME_COLOR, 'YOU');
        drawTorchlight(player.x - camX, player.y - camY);
        drawHUD(camX, camY);
    }
}
// Arriving from the lobby's party PLAY button: start searching straight away.
if (location.hash === '#party') {
    history.replaceState(null, '', location.pathname);
    findMatch();
}
else {
    showIntro();
    openSocket();
}
requestAnimationFrame(loop);
</script>
